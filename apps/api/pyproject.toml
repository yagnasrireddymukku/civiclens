[project]
name = "civiclens-api"
version = "0.1.0"
description = "CivicLens backend API (FastAPI). See docs/API.md and docs/ARCHITECTURE.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    # Tracking + Notifications, rescheduled from Phase 12 (ADR-009):
    # password hashing for the new auth module (app/auth/security.py) —
    # the adaptive salted hash ADR-009/SECURITY.md §2 already specify,
    # not a new decision.
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    # Phase 12 (docs/AI_ARCHITECTURE.md): the one HTTP client the
    # provider-abstraction layer (app/ai/providers_*.py) uses to call an
    # LLM/embedding vendor's REST API directly, instead of adding a
    # vendor SDK per provider (CLAUDE.md rule 13). Already a dev
    # dependency (used by FastAPI's TestClient) — promoted to a real
    # runtime dependency now that production code uses it too.
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    # Tracking + Notifications, rescheduled from Phase 12 (ADR-009): JWT
    # access/refresh token encode-decode for the new auth module — a
    # small, single-purpose library rather than a full auth framework
    # (CLAUDE.md rule 13).
    "pyjwt>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's own idiom is `param: T = Depends(...)`/`= Query(...)` in a
# route signature default — bugbear's B008 (no function calls in
# defaults) exists for a real footgun (a mutable default shared across
# calls), which doesn't apply here since FastAPI evaluates these per
# request, not once at def time.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

[project]
name = "civiclens-api"
version = "0.1.0"
description = "CivicLens backend API (FastAPI). See docs/API.md and docs/ARCHITECTURE.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
test = [
    "pgserver>=0.1.4",
]

[tool.uv]
# `test` is a real, if unusual, runtime dependency of the test suite (an
# embedded PostgreSQL binary — see tests/conftest.py) rather than a pure
# dev tool, but `uv sync`/`uv run pytest` should still pick it up without
# an extra flag.
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

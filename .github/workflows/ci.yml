name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (apps/web, packages/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: Next.js generates .next/types (typed routes) that
      # apps/web's own `tsc --noEmit` depends on. See docs/TESTING.md §16.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

  backend:
    name: Backend (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Every backend test that migrates a database to `head` needs
    # `pg_trgm` (the search_documents migration creates a gin_trgm_ops
    # index unconditionally, docs/SEARCH.md), so this job runs a real
    # Postgres service container rather than an embedded/pip-installed
    # one — it ships every contrib module. See tests/_full_pg_utils.py
    # and tests/conftest.py's `full_pg_database_url` fixture.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CIVICLENS_TEST_FULL_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app

      - name: Test
        run: uv run pytest -q
